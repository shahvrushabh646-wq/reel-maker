services:
  - type: web
    name: reel-maker
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=20000
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: GOOGLE_CSE_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false